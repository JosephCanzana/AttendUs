<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine + Tailwind Test</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div x-data="{ open: false, count: 0, text: '' }" class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md space-y-6">

    <h1 class="text-2xl font-bold text-gray-800">Alpine.js + Tailwind Test</h1>

    <!-- Counter -->
    <div class="flex items-center justify-between bg-gray-50 rounded-lg p-4">
      <span class="text-gray-700 font-medium">Counter: <span x-text="count" class="font-bold text-indigo-600"></span></span>
      <div class="space-x-2">
        <button @click="count--" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">-</button>
        <button @click="count++" class="px-3 py-1 bg-green-500 text-white rounded hover:bg-green-600">+</button>
      </div>
    </div>

    <!-- Toggle -->
    <div>
      <button @click="open = !open" class="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
        <span x-text="open ? 'Hide details' : 'Show details'"></span>
      </button>
      <div x-show="open" x-transition class="mt-3 p-4 bg-indigo-50 rounded-lg text-gray-700">
        If you can see this fade in/out and the counter works, both Alpine.js and Tailwind CSS are loaded correctly. 🎉
      </div>
    </div>

    <!-- Two-way binding -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Type something:</label>
      <input x-model="text" type="text" placeholder="Try typing..."
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p class="mt-2 text-gray-600">You typed: <span class="font-semibold text-gray-800" x-text="text"></span></p>
    </div>

    <p class="text-xs text-gray-400 text-center">Tailwind (CDN) + Alpine.js (CDN) — for quick local testing only, not production.</p>
  </div>

</body>
</html>
